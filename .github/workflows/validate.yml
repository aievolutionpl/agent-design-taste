name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure, links and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        run: python3 scripts/validate.py

      - name: Verify generated files are committed
        run: |
          python3 scripts/gen_tokens.py
          python3 scripts/gen_manifest.py
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run:"
            echo "  python3 scripts/gen_tokens.py && python3 scripts/gen_manifest.py"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Token contrast (WCAG AA on every style palette)
        run: python3 scripts/check_contrast.py

      - name: Context budget
        run: python3 scripts/validate.py --budget

      - name: Installer smoke test
        run: |
          tmp="$(mktemp -d)"
          bash scripts/install.sh --agent all --target "$tmp"
          test -f "$tmp/AGENTS.md"
          test -f "$tmp/CLAUDE.md"
          test -f "$tmp/GEMINI.md"
          test -f "$tmp/.cursor/rules/agent-design-taste.mdc"
          test -f "$tmp/.windsurf/rules/agent-design-taste.md"
          test -f "$tmp/.github/copilot-instructions.md"

  render:
    name: Rendered verification of the 15 example pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Render every example at 1440 / 768 / 390 / 360
        run: node scripts/screenshot.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-screenshots
          path: screenshots/
          retention-days: 7
