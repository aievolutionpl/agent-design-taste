name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure, links and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        run: python3 scripts/validate.py

      - name: Verify generated files are committed
        run: |
          python3 scripts/gen_tokens.py
          python3 scripts/gen_manifest.py
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run:"
            echo "  python3 scripts/gen_tokens.py && python3 scripts/gen_manifest.py"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Context budget
        run: python3 scripts/validate.py --budget

      - name: Installer smoke test
        run: |
          tmp="$(mktemp -d)"
          bash scripts/install.sh --agent all --target "$tmp"
          test -f "$tmp/AGENTS.md"
          test -f "$tmp/CLAUDE.md"
          test -f "$tmp/GEMINI.md"
          test -f "$tmp/.cursor/rules/agent-design-taste.mdc"
          test -f "$tmp/.windsurf/rules/agent-design-taste.md"
          test -f "$tmp/.github/copilot-instructions.md"
