<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="adt:out" content="styles-overview.jpg">
<meta name="adt:size" content="1600x900">
<meta name="adt:full" content="true">
<title>Agent Design Taste — styles overview</title>
<link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;padding:56px 48px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:36px}
h2{font:800 48px/1.02 var(--display);letter-spacing:-.04em;margin-top:16px}
h2 span{color:var(--violet)}
.note{font:500 15px/1.5 var(--body);color:var(--muted);max-width:44ch;text-align:right}
.note b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.shot{aspect-ratio:390/700;overflow:hidden;border-bottom:1px solid var(--line)}
.shot img{display:block;width:100%}
.meta{padding:12px 14px 14px}
.meta .id{font:700 12px var(--mono);color:var(--gold);letter-spacing:.06em}
.meta .name{font:700 16px/1.2 var(--display);letter-spacing:-.01em;margin:4px 0 3px}
.meta .who{font:500 12.5px/1.35 var(--body);color:var(--muted)}
.new{font:700 10px var(--mono);letter-spacing:.08em;color:var(--bg);background:var(--cyan);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.card.next{border:1.5px dashed var(--line-strong);background:transparent;justify-content:center;align-items:flex-start;padding:22px}
.card.next .big{font:800 64px/1 var(--display);color:var(--line-strong);letter-spacing:-.04em}
.card.next p{font:600 18px/1.3 var(--display);margin:14px 0 8px}
.card.next small{font:500 13px/1.5 var(--body);color:var(--muted)}
.card.next code{font:500 12px var(--mono);color:var(--cyan)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:22px;border-top:1px solid var(--line);font:500 13px var(--mono);color:var(--dim);letter-spacing:.04em}
</style>
</head>
<body>
<header>
  <div>
    <div class="lockup" data-mark><span>AI Evolution Polska<br><small>agent-design-taste</small></span></div>
    <h2><span id="n">17</span> styles. One decision.</h2>
  </div>
  <p class="note">Each tile is the <b>390&nbsp;px canonical mobile render</b> of that style's <b>example.html</b> — captured by <code class="mono">scripts/render_assets.mjs</code>, not drawn.</p>
</header>
<div class="grid" id="grid"></div>
<footer><span>styles/NN-slug/ · README.md · tokens.css · prompts.md · example.html</span><span>aievolutionpolska.pl</span></footer>
<script src="mark.js"></script>
<script>
const fresh=new Set(['16','17']);
const who={ '01':'B2B SaaS · fintech','02':'dev tools · dashboards','03':'consumer apps','04':'feature-rich products',
 '05':'creator tools · youth','06':'agencies · portfolios','07':'decorative surfaces only','08':'kids · education',
 '09':'audio · instruments','10':'dev tools · data · corporate','11':'media · long-form','12':'fashion · events',
 '13':'music · streetwear','14':'launches · immersive','15':'portfolios · campaigns','16':'CLIs · AI-agent tooling',
 '17':'food · craft · wellness'};
document.getElementById('n').textContent=ADT.styles.length;
const cards=ADT.styles.map(s=>`<article class="card">
  <div class="shot"><img src="${ADT.shots}${s.slug}-mobile.jpg" alt=""></div>
  <div class="meta"><div class="id">${s.id}${fresh.has(s.id)?'<span class="new">NEW</span>':''}</div>
  <div class="name">${s.name.replace(' (Soft UI)','')}</div><div class="who">${who[s.id]||s.identity}</div></div></article>`);
const pad=(6-ADT.styles.length%6)%6;
for(let i=0;i<pad;i++)cards.push(i===0?`<article class="card next"><div class="big">${String(ADT.styles.length+1).padStart(2,'0')}</div>
  <p>Your style next.</p><small>24-section DNA, tokens, prompts and a page that passes the render check.</small><br><code>CONTRIBUTING.md</code></article>`:'<div></div>');
document.getElementById('grid').innerHTML=cards.join('');
</script>
</body>
</html>
