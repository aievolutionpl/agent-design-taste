<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="adt:out" content="brand-footer.png">
<meta name="adt:size" content="1600x440">
<title>AI Evolution Polska — sign-off</title>
<link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;height:440px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:56px;padding:0 72px}
.grid-bg{position:absolute;inset:0;z-index:-1;-webkit-mask-image:radial-gradient(ellipse 50% 80% at 18% 50%,#000,transparent 80%);mask-image:radial-gradient(ellipse 50% 80% at 18% 50%,#000,transparent 80%)}
.mark{display:flex;align-items:center;gap:26px}
.mark span svg{width:112px;height:112px}
.name{font:800 54px/1 var(--display);letter-spacing:-.04em}
.name small{display:block;font:500 15px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.line{font:600 26px/1.35 var(--display);letter-spacing:-.015em;margin-top:34px;max-width:28ch}
.line em{font-style:normal;color:var(--gold)}
.side{border-left:1px solid var(--line-strong);padding-left:48px;display:grid;gap:22px}
.item .k{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.item .v{font:600 20px/1.3 var(--display)}
.item .v span{color:var(--cyan)}
.item .v.muted{font:500 16px/1.45 var(--body);color:var(--muted)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div>
  <div class="mark"><span data-mark></span><div class="name">AI Evolution Polska<small>+ AI Evolution Labs</small></div></div>
  <p class="line">Practical AI education, agents and automation — built in Poland, <em>open for everyone.</em></p>
</div>
<div class="side">
  <div class="item"><div class="k">web</div><div class="v"><span>aievolutionpolska.pl</span></div></div>
  <div class="item"><div class="k">github · x</div><div class="v">@aievolutionpl</div></div>
  <div class="item"><div class="k">this repository</div><div class="v muted">MIT-licensed. Star it, fork it, add style #<b id="next" style="color:var(--text)">18</b>.</div></div>
</div>
<script src="mark.js"></script>
<script>document.getElementById('next').textContent=ADT.styles.length+1;</script>
</body>
</html>
