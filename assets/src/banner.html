<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="adt:out" content="banner.jpg">
<meta name="adt:size" content="1280x480">
<title>Agent Design Taste — banner</title>
<link rel="stylesheet" href="brand.css">
<style>
body{width:1280px;height:480px;overflow:hidden;position:relative}
.grid-bg{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 60% 90% at 25% 40%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse 60% 90% at 25% 40%,#000 0,transparent 75%)}
.copy{position:absolute;left:64px;top:62px;width:560px;z-index:2}
h1{font:800 76px/0.98 var(--display);letter-spacing:-.045em;margin:30px 0 22px}
h1 span{color:var(--violet)}
.lede{font:500 20px/1.45 var(--body);color:var(--muted);max-width:30ch}
.lede b{color:var(--text);font-weight:600}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.chip{font:500 13px/1 var(--mono);border:1px solid var(--line-strong);border-radius:999px;padding:9px 14px;color:var(--text);background:rgb(20 21 31/.8)}
.chip b{color:var(--gold);font-weight:700}
/* the wall of real renders */
.wall{position:absolute;right:-180px;top:-120px;width:900px;height:760px;perspective:1600px;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 100%)}
.plane{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,280px);gap:18px;transform:rotateX(18deg) rotateY(-24deg) rotateZ(8deg);transform-origin:40% 50%}
.tile{border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);box-shadow:0 30px 60px -30px #000;background:var(--surface)}
.tile img{display:block;width:100%;aspect-ratio:1440/900;object-fit:cover;object-position:top}
.tile .cap{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--muted);padding:6px 9px;letter-spacing:.06em;text-transform:uppercase}
.col2{margin-top:-90px}.col3{margin-top:40px}
.fade{position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,var(--bg));z-index:1}
.sig{position:absolute;left:64px;bottom:34px;z-index:2;display:flex;gap:18px;align-items:center;font:500 12px var(--mono);color:var(--dim);letter-spacing:.06em}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="wall"><div class="plane" id="plane"></div></div>
<div class="fade"></div>
<div class="copy">
  <div class="lockup" data-mark><span>AI Evolution Polska<br><small>open source · MIT</small></span></div>
  <h1>Agent Design<br><span>Taste.</span></h1>
  <p class="lede">Design intelligence for AI coding agents — <b>decide</b> the style, <b>build</b> from tokens, <b>render</b> it, <b>audit</b> it.</p>
  <div class="chips">
    <span class="chip"><b id="n">17</b> style DNAs</span>
    <span class="chip">WCAG AA, measured</span>
    <span class="chip">1440 · 768 · 390</span>
  </div>
</div>
<script src="mark.js"></script>
<script>
const pick=['16','04','11','17','05','10','13','12','01','15','09','03'];
const by=Object.fromEntries(ADT.styles.map(s=>[s.id,s]));
document.getElementById('n').textContent=ADT.styles.length;
const cols=[[],[],[]];pick.forEach((id,i)=>cols[i%3].push(by[id]));
document.getElementById('plane').innerHTML=cols.map((c,i)=>`<div class="col${i+1}" style="display:grid;gap:18px;align-content:start">`+c.map(s=>
 `<div class="tile"><img src="${ADT.shots}${s.slug}-desktop.jpg" alt=""><div class="cap"><span>${s.id} · ${s.name}</span></div></div>`).join('')+'</div>').join('');
</script>
</body>
</html>
